<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MP3 transcribe — browser-whisper</title>
  <meta name="description" content="Download a Whisper model and transcribe an audio file in the browser with browser-whisper." />
  <link rel="canonical" href="https://whisper.tanpreet.xyz/examples/mp3/" />
  <link rel="icon" href="/8134.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared.css" />
  <style>
    select { max-width: min(100%, 260px); }
  </style>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="title-row">
        <h1>MP3 transcribe</h1>
        <span class="badge">Example</span>
      </div>
      <nav class="header-links" aria-label="Site navigation">
        <a href="/examples/" class="back">All examples</a>
        <a href="/">Pkg</a>
        <a href="/docs/">Docs</a>
        <a href="/demo/">Demo</a>
      </nav>
    </header>

    <p class="lead">
      Choose an audio file, download a model, then transcribe. You can also place
      <code>audio.mp3</code> in <code>public/</code> for a default sample at <code>/audio.mp3</code>.
    </p>

    <section class="card" aria-label="Controls">
      <h2>Controls</h2>
      <div class="toolbar">
        <label class="file-input-label" id="fileLabel">
          <input type="file" id="fileInput" accept="audio/*" />
          <span aria-hidden="true">📂</span>
          <span id="fileName">Choose audio</span>
        </label>
        <select id="model" aria-label="Model">
          <optgroup label="Moonshine (English only)">
            <option value="moonshine-tiny">Moonshine Tiny</option>
            <option value="moonshine-base">Moonshine Base</option>
          </optgroup>
          <optgroup label="Whisper">
            <option value="whisper-tiny" selected>Whisper Tiny</option>
            <option value="whisper-base">Whisper Base</option>
            <option value="whisper-small">Whisper Small</option>
          </optgroup>
          <optgroup label="Whisper (timestamped)">
            <option value="whisper-tiny_timestamped">Whisper Tiny Timestamped</option>
            <option value="whisper-base_timestamped">Whisper Base Timestamped</option>
            <option value="whisper-small_timestamped">Whisper Small Timestamped</option>
          </optgroup>
          <optgroup label="Whisper Large">
            <option value="lite-whisper-large-v3-turbo-fast">Lite Large V3 Turbo Fast</option>
            <option value="lite-whisper-large-v3-turbo">Lite Large V3 Turbo</option>
            <option value="lite-whisper-large-v3-turbo-acc">Lite Large V3 Turbo Acc</option>
            <option value="whisper-large-v3-turbo">Whisper Large V3 Turbo</option>
            <option value="whisper-large-v3-turbo_timestamped">Whisper Large V3 Turbo Timestamped</option>
            <option value="whisper-large-v3">Whisper Large V3</option>
          </optgroup>
          <optgroup label="Distil-Whisper (English only)">
            <option value="distil-whisper-small">Distil Whisper Small</option>
          </optgroup>
        </select>
        <button type="button" id="download">Download model</button>
        <button type="button" id="transcribe" class="secondary" disabled>Transcribe</button>
        <button type="button" id="repeat" class="secondary">Re-download</button>
      </div>
    </section>

    <div class="grid-2">
      <section class="panel">
        <h3>Transcript</h3>
        <div id="segments" class="transcript" aria-live="polite"></div>
      </section>
      <section class="panel">
        <h3>Events</h3>
        <pre id="log" class="log-panel"></pre>
      </section>
    </div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
