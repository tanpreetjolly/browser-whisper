<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File transcribe (OPFS cache) — browser-whisper</title>
  <meta name="description" content="OPFS cache demo: manually download a Whisper model, then transcribe an audio file in the browser with browser-whisper." />
  <link rel="canonical" href="https://whisper.tanpreet.xyz/examples/mp3/" />
  <link rel="icon" href="/8134.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared.css" />
  <style>
    select { max-width: min(100%, 260px); }
  </style>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="title-row">
        <h1>File transcribe</h1>
        <span class="badge badge-opfs">OPFS cache</span>
      </div>
      <nav class="header-links" aria-label="Site navigation">
        <a href="/examples/" class="back">All demos</a>
        <a href="/">Pkg</a>
        <a href="/docs/">Docs</a>
        <a href="/demo/">Live demo</a>
      </nav>
    </header>

    <p class="lead">
      OPFS cache workflow: <strong>Download model</strong> fills the browser cache (watch the event log),
      then <strong>Transcribe</strong> runs from cached weights. Pick any audio file, or add
      <code>public/audio.mp3</code> for a default at <code>/audio.mp3</code>.
    </p>

    <section class="card" aria-label="Controls">
      <h2>Controls</h2>
      <div class="toolbar">
        <label class="file-input-label" id="fileLabel">
          <input type="file" id="fileInput" accept="audio/*" />
          <span aria-hidden="true">📂</span>
          <span id="fileName">Choose audio</span>
        </label>
        <select id="model" aria-label="Model">
          <!-- @models:options selected=whisper-tiny sizes=false -->
        </select>
        <button type="button" id="download">Download model</button>
        <button type="button" id="transcribe" class="secondary" disabled>Transcribe</button>
        <button type="button" id="repeat" class="secondary">Re-download</button>
      </div>
<!-- @models:credits -->
    </section>

    <div class="grid-2">
      <section class="panel">
        <h3>Transcript</h3>
        <div id="segments" class="transcript" aria-live="polite"></div>
      </section>
      <section class="panel">
        <h3>Events</h3>
        <pre id="log" class="log-panel"></pre>
      </section>
    </div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
